name: Trailhead Weekly Market Intelligence

on:
  schedule:
    # Runs at 14:00 UTC (07:00 AM Pacific) every Monday
    - cron: '0 14 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

# Read-only: generated briefs are uploaded as artifacts, not pushed to main.
permissions:
  contents: read

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weekly Digest Pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python main.py --mode weekly --days 7 --limit 5

      - name: Upload weekly digest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-intelligence-digest
          path: |
            output/
            data/
            memory/
          if-no-files-found: warn
          retention-days: 14
