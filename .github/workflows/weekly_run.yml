name: Trailhead Weekly Market Intelligence

on:
  schedule:
    # Runs at 14:00 UTC (07:00 AM Pacific) every Monday
    - cron: '0 14 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weekly Digest Pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python main.py --mode digest --days 7 --limit 5

      - name: Commit and Push Generated Weekly Briefs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated Weekly Intelligence Digest [skip ci]"
            git push origin HEAD:main
          fi