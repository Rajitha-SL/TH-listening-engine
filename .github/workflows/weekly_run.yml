name: Trailhead Weekly Market Intelligence

on:
  schedule:
    # 7:00 AM Pacific on Monday = 14:00 UTC (during PDT)
    - cron: '0 14 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Market Listening Engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python main.py --mode weekly

      - name: Commit & Push Generated Digest
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add output/ memory/history_store.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generated weekly digest [$(date +'%Y-%m-%d')]" && git push)